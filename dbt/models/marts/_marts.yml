version: 2

models:
  - name: mart_freight_pressure
    columns:
      - name: month
        tests: [not_null, unique]
      - name: gscpi_zscore
        tests: [not_null]

  - name: mart_currency_exposure
    columns:
      - name: date
        tests: [not_null, unique]

  - name: mart_country_shares
    columns:
      - name: month
        tests: [not_null]
      - name: category_code
        tests: [not_null]
      - name: country
        tests: [not_null]
      - name: country_share
        tests: [not_null]

  - name: mart_origin_concentration
    columns:
      - name: month
        tests: [not_null]
      - name: category_code
        tests: [not_null]
      - name: category_level
        tests:
          - accepted_values:
              values: ["heading", "chapter"]
      - name: hhi
        tests: [not_null]
