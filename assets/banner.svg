<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.45">
      <stop offset="0" stop-color="#ffbfdd"/>
      <stop offset="0.42" stop-color="#e6cfff"/>
      <stop offset="0.72" stop-color="#cde9ff"/>
      <stop offset="1" stop-color="#c9f2e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1.1" r="0.45">
      <stop offset="0" stop-color="#fff0a6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff0a6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#glow2)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="64" y="58" width="566" height="36" rx="18" fill="#ffffff" fill-opacity="0.6" stroke="#4a1d5c" stroke-opacity="0.18"/>
    <text x="84" y="82" font-size="15" fill="#f5b700">★</text>
    <text x="106" y="81" font-size="13" font-weight="700" letter-spacing="1.4" fill="#4a1d5c">FOR SMALL APPAREL AND FOOTWEAR IMPORTERS IN CANADA</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#33163f">
    <text x="62" y="172" font-size="62">Canadian Apparel</text>
    <text x="62" y="246" font-size="62"><tspan font-style="italic" font-weight="600" fill="#c4277a">Import Pressure</tspan> Monitor</text>
  </g>
  <text x="64" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#4d2c57">A heads-up on shipping, currency and supplier risk, before it shows up on the invoice.</text>

  <!-- signal icons -->
  <g transform="translate(905 118)">
    <rect x="0" y="0" width="300" height="132" rx="26" fill="#ffffff" fill-opacity="0.55" stroke="#ffffff" stroke-width="2"/>
    <g transform="translate(26 18)">
      <circle cx="34" cy="34" r="33" fill="#c9f2e0" stroke="#ffffff" stroke-width="3"/>
      <g transform="translate(16 16) scale(1.5)" fill="none" stroke="#4a1d5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 14h18l-2.6 4.5H5.6z"/><rect x="6" y="9.5" width="3.6" height="4.5" rx=".4"/><rect x="10.2" y="7" width="3.6" height="7" rx=".4"/><rect x="14.4" y="10.5" width="3.6" height="3.5" rx=".4"/>
        <path stroke="#3d9be0" d="M2 21.5c1.5 0 1.5-1 3-1s1.5 1 3 1 1.5-1 3-1 1.5 1 3 1 1.5-1 3-1 1.5 1 3 1"/>
      </g>
      <text x="34" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a1d5c">Shipping</text>
    </g>
    <g transform="translate(116 18)">
      <circle cx="34" cy="34" r="33" fill="#fff0a6" stroke="#ffffff" stroke-width="3"/>
      <g transform="translate(16 16) scale(1.5)" fill="none" stroke="#4a1d5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/><path d="M14.6 9.4c-.5-1-1.5-1.5-2.6-1.5-1.4 0-2.5.8-2.5 2s1.1 1.7 2.5 2 2.5.8 2.5 2-1.1 2.1-2.5 2.1c-1.1 0-2.1-.5-2.6-1.5M12 6.4v11.2"/>
      </g>
      <text x="34" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a1d5c">Currency</text>
    </g>
    <g transform="translate(206 18)">
      <circle cx="34" cy="34" r="33" fill="#e4d4ff" stroke="#ffffff" stroke-width="3"/>
      <g transform="translate(16 16) scale(1.5)" fill="none" stroke="#4a1d5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20.5h18"/><path d="M4 20.5V11l5 3v-3l5 3v-3l5 3V5.5h2v15"/><path d="M7 17.5h2M11 17.5h2M15 17.5h2"/>
      </g>
      <text x="34" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a1d5c">Suppliers</text>
    </g>
  </g>

  <!-- knit-stripe edge -->
  <rect x="0" y="388" width="256" height="12" fill="#ff8fc7"/>
  <rect x="256" y="388" width="256" height="12" fill="#ffd84d"/>
  <rect x="512" y="388" width="256" height="12" fill="#7fdcb3"/>
  <rect x="768" y="388" width="256" height="12" fill="#7cc4ff"/>
  <rect x="1024" y="388" width="256" height="12" fill="#b896f5"/>
</svg>
