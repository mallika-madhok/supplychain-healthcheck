[project]
name = "pipeline"
version = "0.1.0"
description = "Canadian Apparel Import Pressure Monitor data pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "xlrd>=2.0",
    "stats-can>=3.3.0",
    "duckdb>=1.0,<=1.5.5",  # MotherDuck extension lags DuckDB releases; pin to its latest supported version
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
